---
# yaml-language-server: $schema=https://kubeschema.imranh.org/core/v1/persistentvolumeclaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-books
  labels:
    backup: daily
spec:
  storageClassName: zfs
  resources:
    requests:
      storage: 32Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
---
# yaml-language-server: $schema=https://kubeschema.imranh.org/core/v1/persistentvolumeclaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-data
  labels:
    backup: daily
spec:
  storageClassName: zfs
  resources:
    requests:
      storage: 8Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
---
# yaml-language-server: $schema=https://kubeschema.imranh.org/apps/v1/deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: bookorbit
    app.kubernetes.io/component: app
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bookorbit
      app.kubernetes.io/part-of: bookorbit
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookorbit
        app.kubernetes.io/part-of: bookorbit
        app.kubernetes.io/component: app
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: bookorbit
          image: ghcr.io/bookorbit/bookorbit:3.8.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: APP_URL
              value: https://bookorbit.${DOMAIN_BASE}
            - name: CLIENT_URL
              value: https://bookorbit.${DOMAIN_BASE}
            - name: LIBRARY_BROWSE_ROOT
              value: /books
            - name: DISABLE_LOCAL_AUTH
              value: "false"
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: bookorbit-database
            - secretRef:
                name: bookorbit-app
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: books
              mountPath: /books
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: books
          persistentVolumeClaim:
            claimName: bookorbit-books
        - name: data
          persistentVolumeClaim:
            claimName: bookorbit-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
# yaml-language-server: $schema=https://kubeschema.imranh.org/core/v1/service
apiVersion: v1
kind: Service
metadata:
  name: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: bookorbit
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: bookorbit
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# yaml-language-server: $schema=https://kubeschema.imranh.org/gateway.networking.k8s.io/v1/httproute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit
spec:
  hostnames:
    # yaml-language-server-disable String does not match the pattern
    - bookorbit.${DOMAIN_BASE}
  parentRefs:
    - kind: Gateway
      name: cilium
      namespace: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bookorbit
          port: 80
